name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create deployment archive
        run: |
          tar \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            -czf /tmp/fe-staging.tar.gz

      - name: Copy archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: /tmp/fe-staging.tar.gz
          target: /tmp/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}    # ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/appuser/frontend/staging/"

            echo "==> Extracting archive as appuser..."
            sudo -u appuser bash -c '
              cd '"$APP_DIR"'

              git pull origin staging
              tar -xzf /tmp/fe-staging.tar.gz -C '"$APP_DIR"'

              echo "==> Installing dependencies..."
              pnpm install --frozen-lockfile --prod
              pm2 reload fe-dev --update-env || pm2 start pnpm --name fe-dev -- start -H 0.0.0.0 -p 3005
              pm2 save
              '
            
            echo "==> Cleaning up..."
            rm -f /tmp/fe-staging.tar.gz

            echo "Staging deploy complete"
      
      - name: Health check
        run: |
          sleep 15
          curl --fail --max-time 30 https://staging.energy-iq.hng14.com || exit 1
